# Xcode project definition. Regenerate with: xcodegen generate
name: AndroiOS
options:
  bundleIdPrefix: com.androios
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  AndroiOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Engine-C/AndroiOSEngine.m
      - path: Engine-C/AndroiOSEngine.h
      - path: Resources/Keyboard/keymaps.json
        buildPhase: resources
      - path: Resources/DefaultVM/default-vm.json
        buildPhase: resources
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: IOSurface.framework
      - sdk: AVFAudio.framework
      - sdk: CoreImage.framework
      - sdk: GameController.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AndroiOS
        UILaunchScreen: {}
        # Explicit scene manifest: UIKit requires scene-based lifecycle on new iOS
        # releases; SwiftUI's App uses one window scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIBackgroundModes: [audio]
        LSApplicationQueriesSchemes: [stikjit]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: AndroiOS.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.androios.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/Engine/AndroiOS-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Engine-C
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: $(PROJECT_DIR)/Engine-C/build/device
        FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]: $(PROJECT_DIR)/Engine-C/build/simulator
        OTHER_LDFLAGS: -framework QEMU
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Embed QEMU + ANGLE frameworks
        basedOnDependencyAnalysis: false
        script: |
          set -e
          case "$PLATFORM_NAME" in iphonesimulator) P=simulator ;; *) P=device ;; esac
          DST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DST"
          for FW in QEMU EGL GLESv2; do
            S="$PROJECT_DIR/Engine-C/build/$P/$FW.framework"
            [ -d "$S" ] || { echo "error: $S missing - run Engine-C/build-angle.sh and build-ios.sh --platform=$P"; exit 1; }
            rsync -a --delete "$S" "$DST/"
            if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DST/$FW.framework"
            fi
          done
          # UEFI firmware for LineageOS virtio VMs (extracted by build-ios.sh).
          cp "$PROJECT_DIR/Engine-C/build/$P/pc-bios/edk2-aarch64-code.fd" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
